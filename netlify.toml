[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

[functions]
  node_bundler = "esbuild"
  external_node_modules = ["edge-tts-universal"]

[[redirects]]
  from = "/api/tts/edge"
  to = "/.netlify/functions/edge-tts"
  status = 200
  force = true

[[redirects]]
  from = "/api/brain/ollama/*"
  to = "/.netlify/functions/ollama-brain/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/api/memory/*"
  to = "/.netlify/functions/memory-api/:splat"
  status = 200
  force = true

[functions."ollama-brain"]
  timeout = 26

[functions."memory-api"]
  timeout = 10

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
